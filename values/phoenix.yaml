service:
  type: ClusterIP

postgresql:
  settings:
    existingSecret: phoenix-db
    superuserPassword:
      value: null
  userDatabase:
    existingSecret: phoenix-db
    name:
      value: null
    user:
      value: null
    password:
      value: null

database:
  postgres:
    user: phoenix
    password: null

auth:
  useSecureCookies: true
  secret:
    - key: PHOENIX_SECRET
      value: ""
    - key: PHOENIX_ADMIN_SECRET
      value: ""
    - key: PHOENIX_POSTGRES_PASSWORD
      valueFrom:
        secretKeyRef:
          name: phoenix-db
          key: USERDB_PASSWORD
    - key: PHOENIX_SMTP_PASSWORD
      value: ""
    - key: PHOENIX_DEFAULT_ADMIN_INITIAL_PASSWORD
      value: ""

ingress:
  enabled: true
  className: traefik
  host: phoenix.localhost
  annotations:
    # HTTPS only: route on Traefik's websecure entrypoint (host 8443), not plain-HTTP web (8080)
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
  tls:
    enabled: true
    certSource: secret
    secret:
      secretName: phoenix-tls

server:
  rootUrl: https://phoenix.localhost:8443
