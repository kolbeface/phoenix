apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata: 
  name: selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: root-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: root-ca
  secretName: root-ca
  issuerRef:
    name: selfsigned
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: my-ca
spec:
  ca:
    secretName: root-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: phoenix-tls
  namespace: phoenix
spec:
  secretName: phoenix-tls
  dnsNames: [phoenix.localhost]
  issuerRef:
    name: my-ca
    kind: ClusterIssuer
